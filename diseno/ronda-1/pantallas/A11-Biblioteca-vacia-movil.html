<style>
body{margin:0}
.m-dark{--bg:#08080A;--surface:#111114;--surface-2:#18181B;--line:#232328;--line-strong:#34343A;--text:#E7E5E4;--text-2:#A8A29E;--text-3:#8C8781;--paper:#0F0F12;--scrim:rgba(0,0,0,.62);
--ok:#7CCB9A;--ok-soft:rgba(124,203,154,.12);--warn:#F0A35E;--warn-soft:rgba(240,163,94,.13);--err:#F2877F;--err-soft:rgba(242,135,127,.12);color-scheme:dark}
.m-light{--bg:#FBFAF8;--surface:#FFFFFF;--surface-2:#F3F1EC;--line:#E6E2DA;--line-strong:#D2CDC3;--text:#16160F;--text-2:#57534E;--text-3:#6B665F;--paper:#FFFFFF;--scrim:rgba(22,22,15,.32);
--ok:#1E7A46;--ok-soft:#E5F2EA;--warn:#9A5B13;--warn-soft:#F8EDDF;--err:#B42318;--err-soft:#FBE7E4;color-scheme:light}
.m-dark.b-tc{--brand:#6DB7C8;--on-brand:#06181D;--ink:#86C6D4;--brand-soft:#0E2A31;--brand-line:#1D4A55;--accent:#F2C14E;--accent-ink:#F2C14E;--accent-soft:rgba(242,193,78,.24);--on-accent:#16160F;--logo:#6DB7C8}
.m-light.b-tc{--brand:#0F4C5C;--on-brand:#FFFFFF;--ink:#0F4C5C;--brand-soft:#E3EEF0;--brand-line:#B9D3D9;--accent:#F2C14E;--accent-ink:#8A6212;--accent-soft:rgba(242,193,78,.45);--on-accent:#16160F;--logo:#0F4C5C}
.m-dark.b-vg{--brand:#8FA6D6;--on-brand:#0A1020;--ink:#9DB2E0;--brand-soft:#141D33;--brand-line:#2A3A5E;--accent:#C8102E;--accent-ink:#F2677A;--accent-soft:rgba(242,103,122,.22);--on-accent:#FFFFFF;--logo:#8FA6D6}
.m-light.b-vg{--brand:#1B2A4A;--on-brand:#FFFFFF;--ink:#1B2A4A;--brand-soft:#E6E9F0;--brand-line:#C3CADA;--accent:#C8102E;--accent-ink:#C8102E;--accent-soft:rgba(200,16,46,.13);--on-accent:#FFFFFF;--logo:#1B2A4A}
.root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss03';box-sizing:border-box}
.root *{box-sizing:border-box}
.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-0.015em}
a{color:var(--ink);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
strong{font-weight:600;color:var(--text)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line-strong);position:relative;margin:0;flex-shrink:0;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--brand)}.switch:checked::after{left:23px;background:var(--on-brand)}
.rng{width:100%;accent-color:var(--brand)}
</style>
