<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #08080A; color: #E7E5E4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: light) { body { background: #FBFAF8; color: #16160F; } p { color: #57534E !important; } }
  main { max-width: 420px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 34px; margin: 20px 0 12px; }
  p { font-size: 17px; line-height: 1.6; color: #A8A29E; margin: 0 0 24px; }
  button { height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #34343A; background: transparent; color: inherit; font-size: 15px; font-weight: 500; }
</style>
</head>
<body>
<main>
  <img src="/academia/icono.png" alt="">
  <h1>Sin conexión</h1>
  <p>No hay internet ahora mismo. En cuanto vuelva, recarga la página y seguirás donde lo dejaste.</p>
  <button type="button" onclick="location.reload()">Volver a intentarlo</button>
</main>
</body>
</html>
